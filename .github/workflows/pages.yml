# Publishes the site to GitHub Pages on every push to main, including brews saved from the site.
# Needs: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you rerun it from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # let a running deploy finish; the next one follows

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Publish only what the website needs. Dev files (server.js, package.json, README.md) stay out.
      # Add new site files to this list.
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html app.js style.css brews.json manifest.webmanifest \
             icon.svg icon-192.png icon-512.png apple-touch-icon.png _site/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
